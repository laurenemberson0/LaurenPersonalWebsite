name: letterboxd-sync

# When does this run?
on:
  schedule:
    - cron: "0 8 * * *"     # every day ~08:00 UTC
    - cron: "0 20 * * *"    # every day ~20:00 UTC
  workflow_dispatch: {}      # lets you (or Claude) run it on demand from the Actions tab

# Allow the job to commit the updated movie list back to the repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull highest-rated films from Letterboxd
        env:
          LETTERBOXD_USER: laurenemberson
        run: node scripts/sync-letterboxd.js

      - name: Commit changes if the list changed
        run: |
          git config user.name "letterboxd-sync"
          git config user.email "actions@users.noreply.github.com"
          git add js/movies-auto.js
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Update movies from Letterboxd"
            git push
          fi
