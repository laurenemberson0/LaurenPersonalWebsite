name: fetch-posters

# Run this by hand from the Actions tab (it's a one-time / re-runnable job).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download posters from Wikipedia
        run: node scripts/fetch-posters.js

      - name: Commit the posters
        run: |
          git config user.name "poster-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add images/movies js/movie-posters.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add movie posters fetched from Apple"
            git push
          fi
